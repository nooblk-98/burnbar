name: Platform compatibility report
description: Tell us how BurnBar behaves on macOS or Linux (works or broken, both help).
title: "[Platform]: "
labels: [platform-compat]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing BurnBar on your system. Reports that say "everything works" are just as useful as bug reports.
        Do not share access tokens, credential files, account IDs, or private session logs.
  - type: input
    id: version
    attributes:
      label: BurnBar version
      description: Release tag, or commit hash for a source build.
      placeholder: v0.5.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS and version
      placeholder: macOS 15.1 / Ubuntu 24.04 / Fedora 41 / Arch
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: CPU architecture
      options:
        - Apple silicon (arm64)
        - Intel / AMD (x86_64)
        - Other ARM
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop environment and display server (Linux)
      description: For example GNOME, KDE Plasma, XFCE, Sway, with X11 or Wayland.
      placeholder: GNOME 47 on Wayland
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - npx installer
        - .AppImage
        - .deb
        - macOS .app / .dmg
        - Built from source
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: App launches
        - label: Tray / menu bar icon appears
        - label: Left-click popup opens next to the icon
        - label: Right-click menu works
        - label: Usage numbers load for my provider(s)
        - label: Notifications and milestone cards show
        - label: Start at login works
        - label: Global shortcut (Ctrl+Alt+B) works
  - type: textarea
    id: broken
    attributes:
      label: What does not work
      description: Describe what you expected and what happened. Screenshots help.
  - type: textarea
    id: logs
    attributes:
      label: Terminal output (optional)
      description: Run the app from a terminal and paste any errors. Remove anything private.
      render: shell
