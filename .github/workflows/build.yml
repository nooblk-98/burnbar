# Builds the Rust/Tauri app, tests the npm installer, and publishes the Windows
# executable, Linux .AppImage/.deb and macOS .app bundles with SHA-256 checksums. Version tags publish unsigned binaries;
# development pushes publish immutable prereleases.
name: build

on:
  push:
    branches: [main, development]
    tags: ["v*"]
  pull_request:
    paths:
      - "rust/**"
      - "npm/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a tag run while it is publishing a release; cancel superseded
  # PR and branch runs instead.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = "0.0.0-dev"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
            if (-not $v.Contains("-")) {
              git fetch --no-tags origin main
              if ($LASTEXITCODE -ne 0) { throw "Could not fetch main" }
              git merge-base --is-ancestor $env:GITHUB_SHA origin/main
              if ($LASTEXITCODE -ne 0) { throw "Stable release tags must point to a commit on main" }
            }
          } elseif ($env:GITHUB_REF -eq "refs/heads/development") {
            $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Stamp the app version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          (Get-Content rust/apps/desktop/tauri.conf.json -Raw) `
            -replace '"version": "[^"]+"', "`"version`": `"$version`"" `
            | Set-Content rust/apps/desktop/tauri.conf.json -NoNewline
          $cargoVersion = '$1"' + $version + '"'
          (Get-Content rust/Cargo.toml -Raw) `
            -replace '(?m)^(version = )"[^"]+"$', $cargoVersion `
            | Set-Content rust/Cargo.toml -NoNewline

      - name: Build release binary
        working-directory: rust
        run: cargo build --release -p burnbar-desktop

      - name: Stage executable and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item rust/target/release/burnbar.exe bin/burnbar.exe
          $hash = (Get-FileHash bin/burnbar.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  burnbar.exe" | Out-File -Encoding ascii bin/burnbar.exe.sha256

      - name: Smoke-test the desktop binary
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'BurnBar UI smoke profile'
          $profile = Join-Path $env:APPDATA 'BurnBar'
          New-Item -ItemType Directory -Force $profile | Out-Null
          '{"providers":"all","startWithWindows":false,"checkUpdates":false,"popupSeconds":2}' | Set-Content (Join-Path $profile 'config.json')
          $process = Start-Process -PassThru bin/burnbar.exe -ArgumentList '--demo','--providers','all','--hidden'
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              throw "BurnBar exited during the smoke test (code $($process.ExitCode))"
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check npm package and stable install/update
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'BurnBar smoke profile'
          $installDir = Join-Path $env:RUNNER_TEMP 'BurnBar smoke install'
          $profile = Join-Path $env:APPDATA 'BurnBar'
          New-Item -ItemType Directory -Force $profile | Out-Null
          '{"startWithWindows":false}' | Set-Content (Join-Path $profile 'config.json')
          'history fixture' | Set-Content (Join-Path $profile 'history.jsonl')
          $packed = npm pack --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed" }
          $package = Join-Path $PWD $packed[0].filename
          npx --yes --package $package burnbar install --channel stable --no-start --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "Stable install smoke check failed" }
          $exe = Join-Path $installDir 'burnbar.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $stamp = (Get-Item $exe).LastWriteTimeUtc
          npx --yes --package $package burnbar update --channel stable --no-start --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "Stable update smoke check failed" }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $hash -or (Get-Item $exe).LastWriteTimeUtc -ne $stamp) { throw "Current executable was rewritten" }
          if ((Get-Content (Join-Path $profile 'config.json') -Raw).Trim() -ne '{"startWithWindows":false}') { throw "Settings changed" }
          if ((Get-Content (Join-Path $profile 'history.jsonl') -Raw).Trim() -ne 'history fixture') { throw "History changed" }
          Remove-Item -LiteralPath $package

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash bin/burnbar.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  burnbar.exe" | Out-File -Encoding ascii bin/burnbar.exe.sha256
          @"
          BurnBar is distributed unsigned.

          SHA-256 of ``burnbar.exe``: ``$hash``
          "@ | Out-File -Encoding utf8 notes.md
          $extra = @()
          if ($env:GITHUB_REF_NAME.Contains("-")) { $extra = @("--prerelease") }
          gh release create "$env:GITHUB_REF_NAME" bin/burnbar.exe bin/burnbar.exe.sha256 `
            --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "BurnBar $env:GITHUB_REF_NAME" `
            --generate-notes --notes-file notes.md @extra

      - name: Verify newly published stable installation
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $visible = $false
          for ($attempt = 0; $attempt -lt 12; $attempt++) {
            $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
            if ($LASTEXITCODE -eq 0 -and $latest -eq $env:GITHUB_REF_NAME) { $visible = $true; break }
            Start-Sleep -Seconds 5
          }
          if (-not $visible) { throw "The stable release is not visible as latest yet" }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'BurnBar stable release smoke profile'
          $installDir = Join-Path $env:RUNNER_TEMP 'BurnBar stable release smoke install'
          node npm/bin/burnbar.cjs install --channel stable --no-start --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "New stable installation failed" }
          $expected = (Get-FileHash bin/burnbar.exe -Algorithm SHA256).Hash
          $installed = Join-Path $installDir 'burnbar.exe'
          if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne $expected) { throw "Installed stable binary does not match this release" }
          $stamp = (Get-Item $installed).LastWriteTimeUtc
          node npm/bin/burnbar.cjs update --channel stable --no-start --install-dir $installDir
          if ($LASTEXITCODE -ne 0 -or (Get-Item $installed).LastWriteTimeUtc -ne $stamp) { throw "Stable repeat update failed or rewrote a current binary" }

      - name: Publish immutable development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dev-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $hash = (Get-FileHash bin/burnbar.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  burnbar.exe" | Out-File -Encoding ascii bin/burnbar.exe.sha256
          gh release create $tag bin/burnbar.exe bin/burnbar.exe.sha256 `
            --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --latest=false `
            --title "BurnBar development ${{ steps.version.outputs.version }}" `
            --notes "Unreleased development build from $env:GITHUB_SHA. Unsigned. May contain bugs."
          if ($LASTEXITCODE -ne 0) { throw "Development release failed" }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'BurnBar development smoke profile'
          node npm/bin/burnbar.cjs install --channel development --no-start --install-dir (Join-Path $env:RUNNER_TEMP 'BurnBar development smoke install')
          if ($LASTEXITCODE -ne 0) { throw "Development install smoke check failed" }

  bundles:
    name: Bundle (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: ""
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: bundle-${{ matrix.target }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Stamp the app version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sed -i.bak -E "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" rust/apps/desktop/tauri.conf.json
          sed -i.bak -E "s/^version = \"[^\"]+\"$/version = \"$VERSION\"/" rust/Cargo.toml
          rm -f rust/apps/desktop/tauri.conf.json.bak rust/Cargo.toml.bak

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        working-directory: rust/apps/desktop
        env:
          NO_STRIP: "true"
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        working-directory: rust/apps/desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles app --target ${{ matrix.target }}

      - name: Stage assets and checksums
        shell: bash
        run: |
          mkdir -p dist
          cd rust/target
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp release/bundle/appimage/*.AppImage ../../dist/burnbar-linux-x64.AppImage
            cp release/bundle/deb/*.deb ../../dist/burnbar-linux-x64.deb
          else
            app="${{ matrix.target }}/release/bundle/macos/BurnBar.app"
            # Unsigned bundles need at least an ad-hoc signature to launch on Apple silicon.
            codesign --force --deep --sign - "$app"
            arch="${{ matrix.target }}"; arch="${arch%%-*}"; [ "$arch" = "aarch64" ] && arch=arm64 || arch=x64
            tar -C "$(dirname "$app")" -czf "../../dist/burnbar-macos-$arch.tar.gz" BurnBar.app
          fi
          cd ../../dist
          for f in *; do
            if command -v sha256sum >/dev/null; then sum=$(sha256sum "$f" | cut -d' ' -f1); else sum=$(shasum -a 256 "$f" | cut -d' ' -f1); fi
            echo "$sum  $f" > "$f.sha256"
          done
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: dist/*
          retention-days: 7

      - name: Attach assets to the GitHub release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/development')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="dev-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; fi
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  npm:
    # Enable after configuring NPM_TOKEN or an npm trusted publisher.
    # Dev commits use the development dist-tag; stable version tags use latest.
    if: >-
      vars.NPM_PUBLISH_ENABLED == 'true' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/development' ||
       (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')))
    needs: [build, bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Set installer package version
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: npm version "$PACKAGE_VERSION" --no-git-tag-version --ignore-scripts
      - name: Publish installer to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.ref == 'refs/heads/development' && 'development' || 'latest' }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"

  winget:
    # Requires an existing winget package; see docs/RELEASING.md.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && vars.WINGET_ENABLED == 'true'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ${{ vars.WINGET_PACKAGE_ID }}
          version: ${{ needs.build.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: 'burnbar\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
