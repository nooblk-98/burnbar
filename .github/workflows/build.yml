# Builds and tests every push and pull request. Pushing a tag like v0.2.0 also:
#   1. sends the exe to SignPath for code signing (SignPath Foundation certificate),
#   2. publishes a GitHub release with the signed exe and its SHA-256 checksum,
#   3. opens a winget-pkgs pull request for the new version (when WINGET_ENABLED is "true").
# One-time setup is described in docs/SIGNING.md.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Generate icon, manifest and version info
        shell: pwsh
        run: |
          $numeric = "${{ steps.version.outputs.version }}".Split("-")[0]
          go run ./tools/genres $numeric

      - name: Build
        shell: pwsh
        run: go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=${{ steps.version.outputs.version }}" -o bin/burnbar.exe ./cmd/burnbar

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: burnbar-unsigned
          path: bin/burnbar.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing waits for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/burnbar.exe
          "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "burnbar.exe is not validly signed" }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash signed/burnbar.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  burnbar.exe" | Out-File -Encoding ascii signed/burnbar.exe.sha256
          gh release create "$env:GITHUB_REF_NAME" signed/burnbar.exe signed/burnbar.exe.sha256 `
            --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --generate-notes

  winget:
    # Updates an existing winget package; the very first version must be submitted by hand (see docs/SIGNING.md).
    if: startsWith(github.ref, 'refs/tags/v') && vars.WINGET_ENABLED == 'true'
    needs: [build, release]
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ${{ vars.WINGET_PACKAGE_ID }}
          version: ${{ needs.build.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: 'burnbar\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
