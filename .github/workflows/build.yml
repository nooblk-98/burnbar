# Vets and builds every push and pull request. Version tags publish the unsigned
# executable and its SHA-256 checksum directly to GitHub Releases.
name: build

on:
  push:
    branches: [main, development]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build native macOS preview
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        run: |
          version=0.0.0-dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          if [[ "$GITHUB_REF" == refs/heads/development ]]; then version="0.0.0-dev.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"; fi
          go vet ./...
          bash scripts/build-macos.sh "$version"
          codesign --verify --deep --strict dist/BurnBar.app
          dist/BurnBar.app/Contents/MacOS/burnbar -demo -once -providers both
      - name: Native macOS UI smoke (synthetic, isolated profile)
        timeout-minutes: 2
        run: |
          export APPDATA="$RUNNER_TEMP/BurnBar-macOS-smoke"
          export BURNBAR_MACOS_SMOKE=1
          dist/BurnBar.app/Contents/MacOS/burnbar -demo -providers both
          node -e 'const fs=require("fs"),path=require("path");const c=JSON.parse(fs.readFileSync(path.join(process.env.APPDATA,"BurnBar","config.json")));if(c.primaryThresholds.join(",")!=="25,50,75,100"||c.popupSeconds!==2)throw Error("Saved preferences missing")'
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/burnbar-macos-${{ matrix.arch }}.zip
            dist/burnbar-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  build:
    needs: macos
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = "0.0.0-dev"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
            if (-not $v.Contains("-")) {
              git fetch --no-tags origin main
              if ($LASTEXITCODE -ne 0) { throw "Could not fetch main" }
              git merge-base --is-ancestor $env:GITHUB_SHA origin/main
              if ($LASTEXITCODE -ne 0) { throw "Stable release tags must point to a commit on main" }
            }
          } elseif ($env:GITHUB_REF -eq "refs/heads/development") {
            $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check npm package and stable install/update
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'BurnBar smoke profile'
          $installDir = Join-Path $env:RUNNER_TEMP 'BurnBar smoke install'
          $profile = Join-Path $env:APPDATA 'BurnBar'
          New-Item -ItemType Directory -Force $profile | Out-Null
          '{"startWithWindows":false}' | Set-Content (Join-Path $profile 'config.json')
          'history fixture' | Set-Content (Join-Path $profile 'history.jsonl')
          $packed = npm pack --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed" }
          $package = Join-Path $PWD $packed[0].filename
          npx --yes --package $package burnbar install --channel stable --no-start --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "Stable install smoke check failed" }
          $exe = Join-Path $installDir 'burnbar.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $stamp = (Get-Item $exe).LastWriteTimeUtc
          npx --yes --package $package burnbar update --channel stable --no-start --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "Stable update smoke check failed" }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $hash -or (Get-Item $exe).LastWriteTimeUtc -ne $stamp) { throw "Current executable was rewritten" }
          if ((Get-Content (Join-Path $profile 'config.json') -Raw).Trim() -ne '{"startWithWindows":false}') { throw "Settings changed" }
          if ((Get-Content (Join-Path $profile 'history.jsonl') -Raw).Trim() -ne 'history fixture') { throw "History changed" }
          Remove-Item -LiteralPath $package

      - name: Vet
        run: go vet ./...

      - name: Generate icon, manifest and version info
        shell: pwsh
        run: |
          $numeric = "${{ steps.version.outputs.version }}".Split("-")[0]
          go run ./tools/genres $numeric

      - name: Build
        shell: pwsh
        run: go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=${{ steps.version.outputs.version }}" -o bin/burnbar.exe ./cmd/burnbar

      - name: Smoke-check native settings and readable usage
        timeout-minutes: 2
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'BurnBar UI smoke profile'
          $uiProfileDir = Join-Path $env:APPDATA 'BurnBar'
          New-Item -ItemType Directory -Force $uiProfileDir | Out-Null
          '{"popupBehaviorVersion":1,"startWithWindows":false,"popupSeconds":2,"checkUpdates":false}' | Set-Content (Join-Path $uiProfileDir 'config.json')
          Add-Type @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class BurnBarUI {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h, int id);
            [DllImport("user32.dll", CharSet=CharSet.Unicode, EntryPoint="SendMessageW")] public static extern IntPtr ReadText(IntPtr h, uint m, IntPtr n, StringBuilder b);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
          }
          '@
          function Wait-Window([string]$title) {
            for ($i=0; $i -lt 50; $i++) {
              $h = [BurnBarUI]::FindWindow('BurnBarControls', $title)
              if ($h -ne [IntPtr]::Zero) { return $h }
              Start-Sleep -Milliseconds 100
            }
            throw "Window did not open: $title"
          }
          function Read-Control($h, [int]$id) {
            $control = [BurnBarUI]::GetDlgItem($h, $id)
            if ($control -eq [IntPtr]::Zero) { throw "Missing control $id" }
            $text = [System.Text.StringBuilder]::new(4096)
            [void][BurnBarUI]::ReadText($control, 0x0d, [IntPtr]$text.Capacity, $text)
            return $text.ToString()
          }
          $process = Start-Process -PassThru bin/burnbar.exe -ArgumentList '-demo','-providers','both'
          try {
            $main = [IntPtr]::Zero
            for ($i=0; $i -lt 50; $i++) {
              $main = [BurnBarUI]::FindWindow('BurnBarMain', 'BurnBar')
              if ($main -ne [IntPtr]::Zero) { break }
              if ($process.HasExited) { throw 'Demo exited before creating its window' }
              Start-Sleep -Milliseconds 100
            }
            if ($main -eq [IntPtr]::Zero) { throw 'Main window not found' }
            [void][BurnBarUI]::PostMessage($main, 0x111, [IntPtr]12, [IntPtr]::Zero)
            $settings = Wait-Window 'BurnBar settings'
            $category = [BurnBarUI]::GetDlgItem($settings, 1000)
            if ($category -eq [IntPtr]::Zero) { throw 'Settings category missing' }
            [void][BurnBarUI]::SendMessage($category, 0x14e, [IntPtr]1, [IntPtr]::Zero)
            [void][BurnBarUI]::PostMessage($settings, 0x111, [IntPtr]66536, $category)
            [void][BurnBarUI]::PostMessage($settings, 0x111, [IntPtr]1012, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 300
            $primary = Read-Control $settings 1008
            $secondary = Read-Control $settings 1009
            if ($primary -ne '50, 80, 95' -or $secondary -ne '50, 80, 95') { throw "Threshold preset mismatch: primary=$primary secondary=$secondary" }
            [void][BurnBarUI]::PostMessage($settings, 0x111, [IntPtr]2, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 200
            $config = Get-Content (Join-Path $uiProfileDir 'config.json') -Raw | ConvertFrom-Json
            if ($null -ne $config.primaryThresholds) { throw 'Cancel saved draft thresholds' }
            [void][BurnBarUI]::PostMessage($main, 0x111, [IntPtr]12, [IntPtr]::Zero)
            $settings = Wait-Window 'BurnBar settings'
            [void][BurnBarUI]::PostMessage($settings, 0x111, [IntPtr]1011, [IntPtr]::Zero)
            [void][BurnBarUI]::PostMessage($settings, 0x111, [IntPtr]1, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 400
            $config = Get-Content (Join-Path $uiProfileDir 'config.json') -Raw | ConvertFrom-Json
            if (($config.primaryThresholds -join ',') -ne '25,50,75,100' -or ($config.secondaryThresholds -join ',') -ne '25,50,75,100') { throw 'Saved thresholds did not persist' }
            [void][BurnBarUI]::PostMessage($main, 0x111, [IntPtr]13, [IntPtr]::Zero)
            $readable = Wait-Window 'BurnBar readable usage'
            $summary = Read-Control $readable 3001
            if ($summary -notmatch 'Claude usage' -or $summary -notmatch 'Codex usage' -or $summary -notmatch '% used') { throw 'Readable summary missing provider usage' }
            Start-Sleep -Seconds 4
            if ([BurnBarUI]::FindWindow('BurnBarControls', 'BurnBar readable usage') -ne [IntPtr]::Zero) { throw 'Readable usage did not expire' }
            if ($process.HasExited) { throw 'Demo crashed during smoke check' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: bin
          merge-multiple: true

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash bin/burnbar.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  burnbar.exe" | Out-File -Encoding ascii bin/burnbar.exe.sha256
          @"
          BurnBar is distributed unsigned.

          SHA-256 of ``burnbar.exe``: ``$hash``
          "@ | Out-File -Encoding utf8 notes.md
          $extra = @()
          if ($env:GITHUB_REF_NAME.Contains("-")) { $extra = @("--prerelease") }
          gh release create "$env:GITHUB_REF_NAME" bin/burnbar.exe bin/burnbar.exe.sha256 bin/burnbar-macos-*.zip bin/burnbar-macos-*.zip.sha256 `
            --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "BurnBar $env:GITHUB_REF_NAME" `
            --generate-notes --notes-file notes.md @extra

      - name: Verify newly published stable installation
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $visible = $false
          for ($attempt = 0; $attempt -lt 12; $attempt++) {
            $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
            if ($LASTEXITCODE -eq 0 -and $latest -eq $env:GITHUB_REF_NAME) { $visible = $true; break }
            Start-Sleep -Seconds 5
          }
          if (-not $visible) { throw "The stable release is not visible as latest yet" }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'BurnBar stable release smoke profile'
          $installDir = Join-Path $env:RUNNER_TEMP 'BurnBar stable release smoke install'
          node npm/bin/burnbar.cjs install --channel stable --no-start --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "New stable installation failed" }
          $expected = (Get-FileHash bin/burnbar.exe -Algorithm SHA256).Hash
          $installed = Join-Path $installDir 'burnbar.exe'
          if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne $expected) { throw "Installed stable binary does not match this release" }
          $stamp = (Get-Item $installed).LastWriteTimeUtc
          node npm/bin/burnbar.cjs update --channel stable --no-start --install-dir $installDir
          if ($LASTEXITCODE -ne 0 -or (Get-Item $installed).LastWriteTimeUtc -ne $stamp) { throw "Stable repeat update failed or rewrote a current binary" }

      - name: Publish immutable development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dev-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $hash = (Get-FileHash bin/burnbar.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  burnbar.exe" | Out-File -Encoding ascii bin/burnbar.exe.sha256
          gh release create $tag bin/burnbar.exe bin/burnbar.exe.sha256 bin/burnbar-macos-*.zip bin/burnbar-macos-*.zip.sha256 `
            --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --latest=false `
            --title "BurnBar development ${{ steps.version.outputs.version }}" `
            --notes "Unreleased development build from $env:GITHUB_SHA. Unsigned. May contain bugs."
          if ($LASTEXITCODE -ne 0) { throw "Development release failed" }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'BurnBar development smoke profile'
          node npm/bin/burnbar.cjs install --channel development --no-start --install-dir (Join-Path $env:RUNNER_TEMP 'BurnBar development smoke install')
          if ($LASTEXITCODE -ne 0) { throw "Development install smoke check failed" }

  npm:
    # Enable after configuring NPM_TOKEN or an npm trusted publisher.
    # Dev commits use the development dist-tag; stable version tags use latest.
    if: >-
      vars.NPM_PUBLISH_ENABLED == 'true' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/development' ||
       (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Set installer package version
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: npm version "$PACKAGE_VERSION" --no-git-tag-version --ignore-scripts
      - name: Publish installer to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ github.ref == 'refs/heads/development' && 'development' || 'latest' }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"

  winget:
    # Requires an existing winget package; see docs/RELEASING.md.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && vars.WINGET_ENABLED == 'true'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ${{ vars.WINGET_PACKAGE_ID }}
          version: ${{ needs.build.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: 'burnbar\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
