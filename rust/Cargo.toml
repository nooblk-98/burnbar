[workspace]
members = ["crates/burnbar-core", "apps/desktop"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/nooblk-98/burnbar"

[workspace.dependencies]
aes = "0.8"
base64 = "0.22"
burnbar-core = { path = "crates/burnbar-core" }
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
glob = "0.3"
pbkdf2 = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
